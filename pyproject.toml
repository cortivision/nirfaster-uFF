[project]
name = "nirfasteruff"
version = "1.2.1"
dependencies = []

[tool.black]
line-length = 100
target-version = ['py313']
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.mypy_cache
    | \.tox
    | \.venv
    | build
    | dist
  )/
)
'''

[tool.setuptools.packages.find]
where = ["."]

# Ship the compiled parts from the nirfaster-uFF release inside the package (they are
# stored in Git LFS, see .gitattributes), so a plain `pip install` gets them. The
# meshers are located next to nirfasteruff_cpu at runtime.
[tool.setuptools.package-data]
nirfasteruff = ["*.pyd", "*.dll", "*.exe", "*.so", "*MAC", "*LINUX"]
